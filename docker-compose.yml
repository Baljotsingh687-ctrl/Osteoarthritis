services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: oa_screening
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - oa_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d oa_screening"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/oa_screening
      DATABASE_SSL: "false"
      JWT_SECRET: local-dev-secret-change-before-deploy
      PORT: 4000
      GAIT_API_URL: http://host.docker.internal:8000
      GAIT_API_TIMEOUT_MS: 120000
      GAIT_MAX_VIDEO_MB: 50
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4000:4000"
volumes:
  oa_pgdata:
